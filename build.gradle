plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    // NeoForge 的版本号，来自 gradle.properties
    enable {
        version = project.neo_version

        // 关掉「反编译 → 重编译」这一步。
        // 这一步要用 javac 去重编译 Minecraft 源码，会从 maven.neoforged.net 拉
        // checker-qual 之类的编译器依赖，而这台机器连不上那个仓库。
        // 关掉之后直接用已下载的游戏 jar，编译和运行都不受影响，
        // 代价只是 IDE 里看不到带注释的 Minecraft 源码。以后网络通了删掉这行即可。
        disableRecompilation = true
    }

    runs {
        client {
            client()
            // 开发环境的 JVM 可能带 -Djava.awt.headless=true，会让「导入」的文件选择框
            // 直接抛 HeadlessException 崩游戏。这里两条都写上，尽量压住它。
            jvmArgument '-Djava.awt.headless=false'
            systemProperty 'java.awt.headless', 'false'
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    maven { url "https://bmclapi2.bangbang93.com/maven" }
    // NeoForge 官方仓库被墙：全部走 ForgeCDN 镜像（内容与官方一致）
    maven { url "https://neoforged.forgecdn.net/releases" }
    // LDLib2（GUI 框架）
    maven { url "https://maven.firstdark.dev/snapshots" }
    mavenCentral()
}

// ModDevGradle 会自己往工程里塞一个 maven.neoforged.net 的仓库，只改上面 repositories{} 管不到它。
// 这里把所有指向官方的仓库地址统一改成镜像。
repositories.all { repo ->
    if (repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository
            && repo.url.toString().contains('maven.neoforged.net')) {
        repo.url = uri('https://neoforged.forgecdn.net/releases')
    }
}

dependencies {
    implementation "com.lowdragmc.ldlib2:ldlib2-neoforge-${minecraft_version}:${ldlib2_version}:all"

    // ============================================================
    // buildlib：结构 NBT 解析 + 幽灵方块预览 + 异步建造（第三方预编译模组）
    // ============================================================
    // 它本身是一个独立的 NeoForge 模组（有自己的 @Mod 和 META-INF/neoforge.mods.toml），
    // 这里用 Jar-in-Jar 把它嵌进 SimulationTown 的 jar 里，发布时只需要发一个文件。
    // 注意：它依然是「另一个模组」，游戏模组列表里会单独出现一项，不去改它的源码。
    def buildlibJar = file('libs/buildlib-0.1.5.jar')
    if (buildlibJar.exists()) {
        implementation files(buildlibJar)   // 编译期可见 + 开发运行时加载（runClient 用）
        jarJar files(buildlibJar)           // 发布时打进 jar 内部
    }

    // ============================================================
    // 临时补丁：手动补齐「Minecraft 游戏库 + 游戏本体 jar」
    // ============================================================
    // 正常流程里，这些由 net.neoforged:minecraft-dependencies:1.21.1 自动带出来。
    // 但这个构件只发在 maven.neoforged.net 上，镜像没有，本机也连不上官方仓库，
    // 所以开发环境里 MC 的游戏库（lwjgl、authlib……）一直是空的，
    // runClient 才会报 NoClassDefFoundError: org/lwjgl/system/Struct。
    //
    // 这里改成直接复用本机已安装的 1.21.1 游戏目录里的库：
    //   gradle/mc-libs.txt   ← 由 D:\aa\a\.minecraft\libraries 生成的绝对路径清单
    // 网络恢复、官方 minecraft-dependencies 能下载之后，把这一段整体删掉即可。
    def mcLibsFile = file('gradle/mc-libs.txt')
    if (mcLibsFile.exists()) {
        def mcLibs = mcLibsFile.readLines()
                .collect { it.trim() }
                .findAll { it && file(it).exists() }
        additionalRuntimeClasspath files(mcLibs)
        compileOnly files(mcLibs)
    }
    additionalRuntimeClasspath files("build/moddev/artifacts/neoforge-${project.neo_version}.jar")
}
